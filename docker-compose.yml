services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unipds-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: embaixador
      POSTGRES_USER: embaixador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embaixador -d embaixador"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: unipds-ai-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./knowledge:/app/knowledge:ro

volumes:
  pgdata:
